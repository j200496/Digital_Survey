<div class="container">
  <div class="row justify-content-center align-items-center vh-100">
    <div class="col-lg-5 col-md-8">
      <div class="card login-card shadow-lg border-0 rounded-4">
        <div class="card-header text-center" [ngStyle]="{'background':color}">
          <h4 class="text-white fw-bold mb-0">Bienvenido</h4>
          <small class="text-muted text-white">Encuesta electoral digital</small>
        </div>
        <div class="row justify-content-center">
          <div class="col-lg-3 col-md-3 col-4 d-flex align-items-center">
    <img
      src="/images/survey1.png"
      width="100"
      class="rounded-4"
      alt="Logo encuesta"
    />
      </div>

        </div>
        <div class="card-body px-4">
          <form id="login-form">
            <div class="form-group mb-3">
              <label class="fw-semibold" for="username">Usuario</label>
              <input
               [(ngModel)]="username"
                type="text"
                class="form-control rounded-pill shadow-sm"
                id="username"
                name="username"
                required
              />
            </div>

            <div class="form-group mb-4">
              <label class="fw-semibold" for="password">Contraseña</label>
              <input
              [(ngModel)]="password"
                type="password"
                class="form-control rounded-pill shadow-sm"
                id="password"
                name="password"
                required
              />
            </div>

            <button
              type="submit"
              class="btn btn-primary mb-3 w-100 rounded-pill shadow-sm py-2 fw-semibold"
              (click)="Login()"
            >
              Iniciar sesión
              <div  class="loader-git"></div>
            </button>
            <button type="button" class=" btn btn-danger w-100 rounded-pill shadow-sm fw-semibold" >
             Cancelar
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
